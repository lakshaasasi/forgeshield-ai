<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ForgeShield — Forensic Report</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#07080f;--surface:#0f1017;--s2:#181920;--border:rgba(255,255,255,0.07);
  --accent:#00e5a0;--accent2:#7b61ff;--danger:#ff4d6d;--warn:#ffb830;--safe:#00e5a0;
  --text:#f0f0f8;--muted:#5c5c72;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;
  background-image:linear-gradient(rgba(0,229,160,.02) 1px,transparent 1px),
  linear-gradient(90deg,rgba(0,229,160,.02) 1px,transparent 1px);
  background-size:48px 48px;pointer-events:none;z-index:0;}
nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;
  justify-content:space-between;padding:15px 48px;
  background:rgba(7,8,15,.9);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.2rem;
  display:flex;align-items:center;gap:10px;}
.logo-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);}
.nav-btns{display:flex;gap:10px;}
.btn{padding:9px 18px;border-radius:10px;font-family:'Syne',sans-serif;
  font-size:.8rem;font-weight:700;cursor:pointer;border:none;transition:all .2s;}
.btn-out{background:transparent;border:1px solid var(--border);color:var(--text);}
.btn-out:hover{border-color:var(--accent);color:var(--accent);}
.btn-pri{background:var(--accent);color:#000;}
.btn-pri:hover{background:#00ffb3;transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,229,160,.3);}
main{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:36px 24px 80px;}
.vbanner{border-radius:24px;padding:36px 44px;display:flex;align-items:center;
  justify-content:space-between;gap:20px;margin-bottom:28px;position:relative;overflow:hidden;}
.vbanner::before{content:'';position:absolute;top:-60px;right:-60px;
  width:220px;height:220px;border-radius:50%;opacity:.1;filter:blur(50px);}
.vf{background:linear-gradient(135deg,rgba(255,77,109,.1),rgba(255,77,109,.03));border:1px solid rgba(255,77,109,.28);}
.vf::before{background:var(--danger);}
.vg{background:linear-gradient(135deg,rgba(0,229,160,.1),rgba(0,229,160,.03));border:1px solid rgba(0,229,160,.28);}
.vg::before{background:var(--safe);}
.vs{background:linear-gradient(135deg,rgba(255,184,48,.1),rgba(255,184,48,.03));border:1px solid rgba(255,184,48,.28);}
.vs::before{background:var(--warn);}
.vleft{flex:1;}
.vtag{font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:2px;opacity:.65;margin-bottom:9px;}
.vtitle{font-family:'Syne',sans-serif;font-size:clamp(1.8rem,4vw,2.6rem);
  font-weight:800;letter-spacing:-1px;margin-bottom:10px;}
.vf .vtitle{color:var(--danger);}
.vg .vtitle{color:var(--safe);}
.vs .vtitle{color:var(--warn);}
.vsummary{color:var(--muted);font-size:.9rem;line-height:1.68;max-width:480px;}
.vring{flex-shrink:0;width:115px;height:115px;position:relative;
  display:flex;align-items:center;justify-content:center;}
.rsvg{width:100%;height:100%;transform:rotate(-90deg);}
.rbg{fill:none;stroke:rgba(255,255,255,.04);stroke-width:8;}
.rfill{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dasharray 1.4s ease;}
.rtext{position:absolute;text-align:center;}
.rpct{font-family:'Syne',sans-serif;font-size:1.45rem;font-weight:800;line-height:1;}
.rsub{font-size:.6rem;color:var(--muted);font-family:'DM Mono',monospace;letter-spacing:.5px;}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:18px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:26px;}
.ctitle{font-family:'Syne',sans-serif;font-weight:700;font-size:.9rem;
  margin-bottom:18px;display:flex;align-items:center;gap:8px;}
.mcard{background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:18px 20px;text-align:center;}
.mv{font-family:'Syne',sans-serif;font-size:1.3rem;font-weight:800;margin-bottom:4px;}
.ml{color:var(--muted);font-size:.72rem;}
.mbar{height:5px;background:var(--s2);border-radius:99px;overflow:hidden;margin-top:10px;}
.mbar-fill{height:100%;border-radius:99px;transition:width 1.4s ease;}
.checks{display:flex;flex-direction:column;gap:12px;}
.check-row{display:flex;align-items:center;gap:14px;}
.check-label{font-size:.8rem;color:var(--muted);width:110px;flex-shrink:0;font-family:'DM Mono',monospace;}
.check-track{flex:1;height:7px;background:var(--s2);border-radius:99px;overflow:hidden;}
.check-fill{height:100%;border-radius:99px;transition:width 1.4s ease;}
.check-val{font-size:.78rem;font-family:'DM Mono',monospace;width:32px;text-align:right;flex-shrink:0;}
.hmap-wrap{background:var(--s2);border-radius:14px;overflow:hidden;
  min-height:240px;display:flex;align-items:center;justify-content:center;
  margin-bottom:14px;position:relative;}
.hmap-wrap img{width:100%;max-height:300px;object-fit:contain;}
.hmap-ph{display:flex;flex-direction:column;align-items:center;gap:10px;
  color:var(--muted);text-align:center;font-size:.85rem;}
.legend{display:flex;gap:14px;flex-wrap:wrap;}
.leg{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);}
.ldot{width:9px;height:9px;border-radius:50%;}
.flags{display:flex;flex-direction:column;gap:10px;}
.flag{display:flex;align-items:flex-start;gap:12px;
  background:var(--s2);border-radius:12px;padding:13px 15px;}
.fbadge{padding:3px 9px;border-radius:6px;font-family:'DM Mono',monospace;
  font-size:.65rem;flex-shrink:0;margin-top:2px;}
.fhigh{background:rgba(255,77,109,.14);color:var(--danger);border:1px solid rgba(255,77,109,.25);}
.fmed{background:rgba(255,184,48,.14);color:var(--warn);border:1px solid rgba(255,184,48,.25);}
.flow{background:rgba(0,229,160,.08);color:var(--safe);border:1px solid rgba(0,229,160,.2);}
.ftxt{font-size:.84rem;line-height:1.5;}
.ftxt strong{display:block;margin-bottom:2px;font-weight:500;}
.ftxt span{color:var(--muted);}
.summary-box{line-height:1.8;font-size:.9rem;color:var(--muted);}
.summary-box strong{color:var(--text);}
footer{border-top:1px solid var(--border);text-align:center;
  padding:26px;color:var(--muted);font-size:.73rem;font-family:'DM Mono',monospace;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.anim{animation:fadeUp .5s ease forwards;opacity:0;}
.a1{animation-delay:.05s}.a2{animation-delay:.15s}.a3{animation-delay:.25s}.a4{animation-delay:.35s}
@media(max-width:768px){
  nav{padding:13px 18px;}
  main{padding:24px 14px 60px;}
  .vbanner{flex-direction:column;padding:26px 22px;}
  .g2,.g3{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<nav>
  <div class="logo"><div class="logo-dot"></div>ForgeShield</div>
  <div class="nav-btns">
    <button class="btn btn-out" onclick="location.href='/'">← New Analysis</button>
    <button class="btn btn-pri" onclick="dlReport()">⬇ Download Report</button>
  </div>
</nav>
<main id="main"></main>
<footer>ForgeShield v2.0 — NIT Hackathon 2026 &nbsp;|&nbsp; Built with AI &amp; ❤️ in Chennai</footer>
<script>
const raw = sessionStorage.getItem('fsr');
if(!raw){
  document.getElementById('main').innerHTML=`
    <div style="text-align:center;padding:100px 24px">
      <div style="font-size:3rem">🔍</div>
      <p style="color:var(--muted);margin:14px 0 24px">No analysis found. Please upload a document first.</p>
      <button class="btn btn-pri" onclick="location.href='/'">Go to Upload</button>
    </div>`;
} else { render(JSON.parse(raw)); }

function cls(v){
  const x=(v||'').toLowerCase();
  if(x.includes('forg')||x.includes('fake')||x.includes('tamp')) return 'f';
  if(x.includes('gen')||x.includes('auth')||x.includes('real'))  return 'g';
  return 's';
}
function clsColor(c){return{f:'#ff4d6d',g:'#00e5a0',s:'#ffb830'}[c];}
function clsLabel(c){return{f:'🚨 FORGED',g:'✅ GENUINE',s:'⚠️ SUSPICIOUS'}[c];}
function sevCls(s){
  const x=(s||'').toLowerCase();
  return x.includes('high')||x.includes('crit')?'high':x.includes('med')||x.includes('warn')?'med':'low';
}
function bar(val,color){
  return `<div class="check-track"><div class="check-fill" style="width:${val}%;background:${color}"></div></div>`;
}
function checkColor(v){return v>60?'#ff4d6d':v>35?'#ffb830':'#00e5a0';}

function render(d){
  const c   = cls(d.verdict);
  const col = clsColor(c);
  const score = d.forge_score||0;
  const conf  = d.confidence||0;
  const circ  = 2*Math.PI*48;
  const fill  = (score/100)*circ;
  const checks = d.checks||{ela:0,noise:0,edge:0,meta:0};
  const flags  = d.flags||[];

  document.getElementById('main').innerHTML = `
    <div class="vbanner v${c} anim a1">
      <div class="vleft">
        <div class="vtag">ANALYSIS COMPLETE — ${(d.filename||'DOCUMENT').toUpperCase()}</div>
        <div class="vtitle">${clsLabel(c)}</div>
        <div class="vsummary">${d.summary||''}</div>
      </div>
      <div class="vring">
        <svg class="rsvg" viewBox="0 0 110 110">
          <circle class="rbg" cx="55" cy="55" r="48"/>
          <circle class="rfill" id="rf" cx="55" cy="55" r="48"
            stroke="${col}" stroke-dasharray="0 ${circ}"/>
        </svg>
        <div class="rtext">
          <div class="rpct" style="color:${col}">${score}%</div>
          <div class="rsub">FORGE<br/>SCORE</div>
        </div>
      </div>
    </div>

    <div class="g3 anim a2">
      <div class="mcard">
        <div class="mv" style="color:${col}">${conf}%</div>
        <div class="ml">Model Confidence</div>
        <div class="mbar"><div class="mbar-fill" id="cbar" style="width:0%;background:${col}"></div></div>
      </div>
      <div class="mcard">
        <div class="mv" style="color:var(--accent2)">${d.language_detected||'Auto-Detected'}</div>
        <div class="ml">Language Detected</div>
      </div>
      <div class="mcard">
        <div class="mv">${flags.length}</div>
        <div class="ml">Issues Flagged</div>
      </div>
    </div>

    <div class="g2 anim a3">
      <div class="card">
        <div class="ctitle">🔥 Suspicion Heatmap</div>
        <div class="hmap-wrap">
          ${d.heatmap_data
            ? `<img src="data:image/png;base64,${d.heatmap_data}" alt="Heatmap"/>`
            : `<div class="hmap-ph"><div style="font-size:2.8rem">🗺️</div><div>Heatmap generated<br/>from real document analysis</div></div>`}
        </div>
        <div class="legend">
          <div class="leg"><div class="ldot" style="background:#ff4d6d"></div>High Risk</div>
          <div class="leg"><div class="ldot" style="background:#ffb830"></div>Moderate</div>
          <div class="leg"><div class="ldot" style="background:#00e5a0"></div>Clean</div>
        </div>
      </div>
      <div class="card">
        <div class="ctitle">🚩 Detected Issues</div>
        <div class="flags">
          ${flags.length ? flags.map(f=>`
            <div class="flag">
              <span class="fbadge f${sevCls(f.severity)}">${(f.severity||'LOW').toUpperCase()}</span>
              <div class="ftxt"><strong>${f.title||'Anomaly'}</strong><span>${f.description||''}</span></div>
            </div>`).join('')
          : `<div class="flag"><span class="fbadge flow">CLEAN</span><div class="ftxt"><strong>No issues found</strong><span>All forensic checks passed.</span></div></div>`}
        </div>
      </div>
    </div>

    <div class="g2 anim a4">
      <div class="card">
        <div class="ctitle">📊 Detection Breakdown</div>
        <div class="checks">
          <div class="check-row"><div class="check-label">ELA</div>${bar(checks.ela,checkColor(checks.ela))}<div class="check-val" style="color:${checkColor(checks.ela)}">${checks.ela}</div></div>
          <div class="check-row"><div class="check-label">Noise</div>${bar(checks.noise,checkColor(checks.noise))}<div class="check-val" style="color:${checkColor(checks.noise)}">${checks.noise}</div></div>
          <div class="check-row"><div class="check-label">Edge</div>${bar(checks.edge,checkColor(checks.edge))}<div class="check-val" style="color:${checkColor(checks.edge)}">${checks.edge}</div></div>
          <div class="check-row"><div class="check-label">Metadata</div>${bar(checks.meta,checkColor(checks.meta))}<div class="check-val" style="color:${checkColor(checks.meta)}">${checks.meta}</div></div>
        </div>
      </div>
      <div class="card">
        <div class="ctitle">📋 Plain-Language Summary</div>
        <div class="summary-box">${buildPlain(d,c)}</div>
      </div>
    </div>
  `;

  setTimeout(()=>{
    document.getElementById('rf').style.strokeDasharray=`${fill} ${circ}`;
    document.getElementById('cbar').style.width=conf+'%';
  },200);
}

function buildPlain(d,c){
  const rows=[
    c==='f' ? '🔴 <strong>FORGED</strong> — This document has strong signs of tampering. Do not accept it.'
    : c==='g' ? '🟢 <strong>GENUINE</strong> — No significant manipulation detected. Document appears authentic.'
    : '🟡 <strong>SUSPICIOUS</strong> — Some anomalies found. Human review recommended.',
    `📌 Language identified as <strong>${d.language_detected||'Unknown'}</strong>.`,
    `📊 Forgery score: <strong>${d.forge_score||0}/100</strong> &nbsp;|&nbsp; Confidence: <strong>${d.confidence||0}%</strong>`,
    (d.flags||[]).filter(f=>f.severity==='HIGH').length > 0
      ? `⚠️ <strong>${(d.flags||[]).filter(f=>f.severity==='HIGH').length} high-severity</strong> issue(s) require immediate attention.`
      : '✅ No high-severity issues detected.'
  ];
  return rows.join('<br/><br/>');
}

function dlReport(){
  const raw=sessionStorage.getItem('fsr'); if(!raw) return;
  const d=JSON.parse(raw);
  const txt=`FORGESHIELD FORENSIC REPORT
============================
File       : ${d.filename||'Unknown'}
Date       : ${new Date().toLocaleString()}
Verdict    : ${d.verdict||'Unknown'}
Forge Score: ${d.forge_score||0}/100
Confidence : ${d.confidence||0}%
Language   : ${d.language_detected||'Unknown'}

DETECTION BREAKDOWN
--------------------
ELA Score      : ${(d.checks||{}).ela||0}/100
Noise Score    : ${(d.checks||{}).noise||0}/100
Edge Score     : ${(d.checks||{}).edge||0}/100
Metadata Score : ${(d.checks||{}).meta||0}/100

FLAGGED ISSUES
--------------
${(d.flags||[]).map(f=>`[${(f.severity||'?').toUpperCase()}] ${f.title||''}
  ${f.description||''}`).join('\n\n')||'None'}

SUMMARY
-------
${(d.summary||'').replace(/<[^>]+>/g,'')}

============================
Generated by ForgeShield v2.0
NIT Hackathon 2026`;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));
  a.download=`forgeshield-report-${Date.now()}.txt`;
  a.click();
}
</script>
</body>
</html>
